[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-pulse"
dynamic = ["version"]
description = "SIEM log source health monitor: find devices that stopped sending logs to QRadar, Splunk, Sentinel, Elastic, FortiSIEM, Wazuh and more, across many SOC/MSSP clients."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The SIEM Pulse Authors" }]
keywords = [
    "siem", "soc", "mssp", "log-monitoring", "log-source-health",
    "log-ingestion", "qradar", "fortisiem", "seceon", "splunk", "sentinel", "elastic", "wazuh",
    "sumologic", "mitre-attack", "security-monitoring",
    "cybersecurity", "blue-team", "security-automation", "alerting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.6.0"]

[project.urls]
Homepage = "https://github.com/abhinav7077/siem-pulse"
Documentation = "https://abhinav7077.github.io/siem-pulse/"
Changelog = "https://github.com/abhinav7077/siem-pulse/blob/main/CHANGELOG.md"
Repository = "https://github.com/abhinav7077/siem-pulse"
Issues = "https://github.com/abhinav7077/siem-pulse/issues"
Roadmap = "https://github.com/abhinav7077/siem-pulse/blob/main/ROADMAP.md"

[project.scripts]
siem-pulse = "siem_pulse.cli:main"

[tool.setuptools.packages.find]
include = ["siem_pulse*"]

[tool.setuptools.dynamic]
version = { attr = "siem_pulse.__version__" }

[tool.setuptools.package-data]
siem_pulse = ["templates/*", "templates/env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731"]  # small lambdas like `esc = lambda v: ...` are fine
